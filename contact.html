	<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)), url("L.jpg");
            background-size: cover;
            background-attachment: fixed;
            color: #333;
            padding-bottom: 50px;
		}

		.nav {
            background-color: #ffffff;
            border-radius: 50px;
            list-style-type: none;
            text-align: center;
            overflow: hidden;
            position: sticky;
            top: 20px;
            max-width: 800px;
            margin: 30px auto;
            padding: 5px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            z-index: 100;
        }

        .nav li {
            display: inline-block;
        }

        .nav li a {
            display: block;
            color: #555;
            font-size: 18px;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 30px;
        }

        .nav li a:hover {
            background-color: #ffeef2;
            color: #e74c3c;
        }

		img{
			float:center;
			border:2px solid blue;
		}

		h1{
			color: #e74c3c;
            text-align: center;
            font-size:60px;
            font-weight: bold;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
		}

		h2{
			text-align:center;
			font-weight:bold;
			padding-top:90px;
			font-size:25px;
			color:#4d0477;
		}

		p{
			text-align:center;
			font-size:20px;
			font-weight:bold;
			color:#110135;
		}

	</style>
</head>
